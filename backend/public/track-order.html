<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>طلباتي | ديور للأزياء</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
  <link rel="manifest" href="/manifest.json">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="ديور للأزياء"
>

<link
  rel="apple-touch-icon"
  href="/images/logo.jpg"
>

  <style>

    .track-page {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    .track-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .track-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    .track-form label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }
.customer-delivered-order {
  position: relative;
  margin-bottom: 12px;
  padding: 12px;
  background: #f7f7f7;
  border: 1px solid #e5e5e5;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.2s;
}

.customer-delivered-order:hover {
  transform: translateY(-1px);
}

.delivered-order-check {
  position: absolute;
  top: 8px;
  left: 8px;

  width: 30px;
  height: 30px;

  border-radius: 50%;

  background: #22c55e;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
  font-weight: bold;
}

.delivered-order-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding-left: 40px;
}

.delivered-order-summary strong {
  display: block;
  font-size: 14px;
  color: #555;
}

.delivered-order-summary span {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  color: #777;
}

.delivered-order-summary small {
  display: block;
  margin-top: 3px;
  color: #999;
  font-size: 11px;
}

.delivered-status {
  color: #22a447 !important;
  font-weight: bold;
  white-space: nowrap;
}

.customer-delivered-details {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #ddd;
}

.customer-order-card {
  margin-bottom: 16px;
  padding: 16px;
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 14px;
}

.customer-order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.customer-order-header strong {
  display: block;
}

.customer-order-header small {
  display: block;
  margin-top: 4px;
  color: #888;
  font-size: 12px;
}

.customer-order-status {
  padding: 6px 10px;
  background: #f1f1f1;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
}

.track-product-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.track-product-item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 9px;
  background: #eee;
}

.track-product-item strong {
  display: block;
  font-size: 14px;
}

.track-product-item span {
  display: block;
  margin-top: 3px;
  color: #777;
  font-size: 12px;
}

.track-total {
  margin-top: 12px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 9px;
  font-weight: bold;
}
    .track-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
    }

    .track-button {
      width: 100%;
      border: none;
      padding: 15px;
      margin-top: 20px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-family: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    .track-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .track-message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .orders-title {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .order-card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      background: #fff;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-number {
      font-size: 20px;
      font-weight: bold;
    }

    .order-date {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .status-badge {
      background: #111;
      color: white;
      border-radius: 20px;
      padding: 8px 13px;
      font-size: 14px;
      font-weight: bold;
    }

    .status-timeline {
      margin: 20px 0;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 12px;
    }

    .status-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: #999;
    }

    .status-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }
.home-button {
  display: block;
  width: fit-content;
  margin: 15px auto;
  padding: 10px 18px;
  background: #111;
  color: #fff;
  text-decoration: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
  transition: 0.2s;
}

.home-button:hover {
  opacity: 0.85;
}
    .status-step.completed,
    .status-step.current {
      color: #111;
      font-weight: bold;
    }

    .status-step.completed .status-icon,
    .status-step.current .status-icon {
      background: #111;
      color: white;
    }

    .status-step.current .status-icon {
      box-shadow: 0 0 0 4px #ddd;
    }

    .products-title {
      margin-top: 20px;
    }

    .order-product {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-product:last-child {
      border-bottom: none;
    }

    .order-product img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      background: #f5f5f5;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-detail {
      color: #666;
      font-size: 14px;
      margin: 3px 0;
    }

    .summary {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .summary-total {
      border-top: 1px solid #ddd;
      margin-top: 8px;
      padding-top: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-info {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
    }

    .empty-orders {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }
    /* ==========================================
   إشعارات الطلب
========================================== */

.push-notification-box {
  margin-top: 15px;
  text-align: center;
}

.enable-notifications-button {
  width: 100%;
  border: none;
  padding: 14px 16px;
  border-radius: 12px;

  background: #111;
  color: white;

  font-family: inherit;
  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.enable-notifications-button:hover {
  opacity: .9;
}

.enable-notifications-button:active {
  transform: scale(.98);
}

.enable-notifications-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.notification-message {
  margin: 10px 0 0;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.7;
}

.notification-message.success {
  color: #198754;
}

.notification-message.error {
  color: #c62828;
}

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      .track-page {
        margin: 10px auto;
        padding: 12px;
      }

      .track-card {
        padding: 18px;
      }

      .order-card {
        padding: 14px;
      }

      .order-number {
        font-size: 18px;
      }

      .order-product img {
        width: 60px;
        height: 60px;
      }

    }

  </style>

</head>

<body>
<a href="index.html" class="home-button">
  🏠 العودة إلى الشاشة الرئيسية
</a>
  <main class="track-page">

    <h1 class="track-title">
      🛍️ طلباتي
    </h1>


    <!-- البحث برقم الهاتف -->

    <section class="track-card">

      <form
        id="trackForm"
        class="track-form"
      >

        <label>
          رقم الهاتف
        </label>

        <input
          id="customerPhone"
          type="tel"
          required
          placeholder="مثال: 777000000"
          autocomplete="tel"
        >

        <button
          type="submit"
          class="track-button"
          id="trackButton"
        >
          🔎 عرض طلباتي
        </button>
<!-- تفعيل إشعارات الطلب -->
<div class="push-notification-box">

  <button
    type="button"
    id="enableNotificationsButton"
    class="enable-notifications-button"
  >
    🔔 تفعيل إشعارات الطلب
  </button>

  <p id="notificationMessage" class="notification-message"></p>

</div>
        <div
          id="trackMessage"
          class="track-message"
        ></div>

      </form>

    </section>


    <!-- جميع الطلبات -->

    <section
      id="ordersResult"
      class="hidden"
    >

      <div class="track-card">

        <h2 class="orders-title">
          📦 طلباتك
        </h2>

        <div id="ordersList"></div>

      </div>

    </section>

  </main>


  <script src="track-order.js"></script>

</body>

</html>
