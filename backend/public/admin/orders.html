<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>الطلبات | ديور للأزياء</title>

  <link rel="stylesheet" href="admin.css">

  <style>
    body {
      background: #f7f7f7;
    }

    .orders-page {
      max-width: 1200px;
      margin: 25px auto;
      padding: 15px;
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .orders-header h1 {
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-buttons a,
    .header-buttons button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      background: #111;
      color: white;
    }

    .orders-message {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
    }

    .order-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-number {
      font-size: 19px;
      font-weight: bold;
    }

    .order-date {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .order-status {
      padding: 8px 12px;
      border-radius: 20px;
      background: #eee;
      font-weight: bold;
      font-size: 14px;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .order-section {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
    }

    .order-section h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 17px;
    }

    .customer-line {
      margin: 8px 0;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .products-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-line {
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .product-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .product-line img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-info span {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
    }

    .summary-total {
      border-top: 1px solid #ddd;
      margin-top: 8px;
      padding-top: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .status-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .status-controls select {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      background: white;
    }

    .status-controls button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #111;
      color: white;
      cursor: pointer;
      font-family: inherit;
    }

    .whatsapp-button {
      background: #168c45 !important;
    }

    .map-button {
      display: inline-block;
      margin-top: 8px;
      background: #eee;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 12px;
    }

    @media (max-width: 700px) {
      .order-grid {
        grid-template-columns: 1fr;
      }

      .orders-page {
        padding: 10px;
      }

      .order-card {
        padding: 14px;
      }

      .status-controls {
        align-items: stretch;
      }

      .status-controls select,
      .status-controls button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="orders-page">

    <div class="orders-header">
      <h1>طلبات العملاء</h1>

      <div class="header-buttons">
        <a href="/admin">لوحة المنتجات</a>
        <button type="button" onclick="loadOrders()">
          تحديث الطلبات
        </button>
        <div class="admin-push-box">

  <div class="admin-push-content">

    <div class="admin-push-icon">
      🔔
    </div>

    <div>
      <h3>إشعارات الطلبات</h3>

      <p>
        فعّل الإشعارات ليصلك تنبيه فور وصول طلب جديد.
      </p>
    </div>

  </div>

  <button
    type="button"
    id="enableAdminNotificationsButton"
    class="admin-push-button"
  >
    🔔 تفعيل إشعارات الطلبات
  </button>

  <p
    id="adminNotificationMessage"
    class="admin-notification-message"
  ></p>

        </div>
      </div>
    </div>

    <div id="ordersMessage" class="orders-message">
      جاري تحميل الطلبات...
    </div>

    <div id="ordersList"></div>

  </main>

 <script src="admin-push.js"></script>
<script src="orders.js"></script>

</body>

</html>
