<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل دخول الإدارة | ديور للأزياء</title>

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>

<body class="login-page">

  <div class="login-card">

    <img
      src="../images/logo.jpg"
      class="admin-logo"
      alt="ديور للأزياء"
    >

    <h1>
      لوحة الإدارة
    </h1>

    <p>
      ديور للأزياء
    </p>

    <form id="loginForm">

      <label>
        اسم المستخدم
      </label>

      <input
        type="text"
        id="username"
        required
        autocomplete="username"
      >

      <label>
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">
        تسجيل الدخول
      </button>

      <div id="loginMessage"></div>

    </form>

  </div>

  <script src="admin.js"></script>

</body>

</html>
